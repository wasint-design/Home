<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muvmi — Choose on Map</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="pages/choose-map/choose-map.css">
  <link rel="stylesheet" href="css/hoppoint-banner.css">
  <link rel="stylesheet" href="css/save-favorite.css">
</head>
<body>

  <div class="phone">

    <!-- ===== MAP SECTION ===== -->
    <div class="cm-map" id="cmMap">

      <!-- Leaflet map -->
      <div id="mapLeaflet"></div>

      <!-- Status bar -->
      <div class="status-bar">
        <span class="status-bar-time">9:41</span>
        <div class="status-bar-icons">
          <img src="assets/icons/signal.svg" alt="" width="16" height="16">
          <img src="assets/icons/wifi.svg" alt="" width="16" height="16">
          <img src="assets/icons/battery.svg" alt="" width="18" height="18">
        </div>
      </div>

      <!-- Header: back + area pill -->
      <div class="cm-header">
        <button class="map-back-btn tappable" onclick="history.back()">
          <img src="assets/icons/back-btn.svg" alt="Back" width="32" height="32">
        </button>
        <div class="cm-area-pill">
          <img src="assets/icons/map-icon.svg" alt="" width="16" height="16">
          <span class="cm-area-name" data-id="areaName">Sukhumvit</span>
          <div class="cm-area-dot">
            <div class="cm-area-dot-glow"></div>
            <div class="cm-area-dot-core"></div>
          </div>
        </div>
      </div>

      <!-- Category filter chips -->
      <div class="cm-chips-row" data-drag="horizontal">
        <button class="cm-chip tappable" data-category="restaurant">
          <img src="assets/icons/chip-restaurant.svg" alt="" width="12" height="12">
          <span>Restaurant</span>
        </button>
        <button class="cm-chip tappable" data-category="activity">
          <img src="assets/icons/chip-activity.svg" alt="" width="12" height="12">
          <span>Activity</span>
        </button>
        <button class="cm-chip tappable" data-category="cafe">
          <img src="assets/icons/chip-cafe.svg" alt="" width="12" height="12">
          <span>Cafe</span>
        </button>
        <button class="cm-chip tappable" data-category="mall">
          <img src="assets/icons/chip-mall.svg" alt="" width="12" height="12">
          <span>Mall</span>
        </button>
        <button class="cm-chip tappable" data-category="park">
          <img src="assets/icons/chip-park.svg" alt="" width="12" height="12">
          <span>Park</span>
        </button>
        <button class="cm-chip tappable" data-category="museum">
          <img src="assets/icons/chip-museum.svg" alt="" width="12" height="12">
          <span>Museum</span>
        </button>
      </div>

      <!-- Promo banner (floating on map) -->
      <div class="cm-promo-banner" id="cmPromoBanner">
        <!-- Decorative rotated squares -->
        <div class="cm-promo-deco cm-promo-deco1"></div>
        <div class="cm-promo-deco cm-promo-deco2"></div>
        <div class="cm-promo-deco cm-promo-deco3"></div>
        <div class="cm-promo-deco cm-promo-deco4"></div>
        <div class="cm-promo-deco cm-promo-deco5"></div>
        <!-- Star badge -->
        <div class="cm-promo-badge">
          <img src="assets/icons/promo-star.png" alt="" class="cm-promo-star">
          <span class="cm-promo-badge-text">PROMO!</span>
        </div>
        <!-- Text -->
        <div class="cm-promo-text">
          <p class="cm-promo-line1">15% Cashback for off-peak rides!</p>
          <p class="cm-promo-line2">Use code "NY15" for discount</p>
        </div>
        <!-- Close -->
        <button class="cm-promo-close tappable" onclick="document.getElementById('cmPromoBanner').style.display='none'">
          <img src="assets/icons/promo-close.svg" alt="×" width="8" height="8">
        </button>
      </div>

    </div><!-- /cm-map -->

    <!-- ===== HOP-POINT INFO DIALOG ===== -->
    <div id="hpInfoDialog" class="hp-info-dialog hidden">
      <div class="hp-info-backdrop" onclick="closeHpDialog()"></div>
      <div class="hp-info-wrap">

        <div class="hp-banner-wrap" id="hpBannerWrap">
          <div class="hp-banner">
            <img class="hp-banner-bg-graphic" src="" alt="" style="display:none">
            <div class="hp-ell-left"></div>
            <div class="hp-ell-right"></div>
            <div class="hp-sparkle hp-sp1"></div>
            <div class="hp-sparkle hp-sp2"></div>
            <div class="hp-sparkle hp-sp3"></div>
            <div class="hp-sparkle hp-sp4"></div>
            <div class="hp-banner-content">
              <img src="assets/icons/discount.svg" class="hp-banner-icon" alt="">
              <div class="hp-text-clip">
                <div class="hp-banner-text">Use <b>"OFF15"</b> for hop point discount</div>
              </div>
            </div>
          </div>
        </div>

        <div class="hp-info-card">
          <div class="hp-card-header">
            <div class="hp-card-pin-wrap">
              <img src="assets/icons/hop-point-list.svg" alt="" width="14" height="19">
              <span id="hpInfoPinLetter" class="hp-card-pin-letter">A</span>
            </div>
            <span class="hp-card-name" id="hpInfoName">Hop-point</span>
            <button class="hp-card-close tappable" onclick="closeHpDialog()">
              <img src="assets/icons/x-close.svg" alt="Close" width="20" height="20">
            </button>
          </div>

          <div class="hp-card-scroll">
            <div class="hp-hours-row">
              <button class="hp-hours-pill tappable">
                <img src="assets/icons/clock.svg" alt="" width="10" height="10">
                <span>Opening Hours</span>
                <img src="assets/icons/chevron-down-sm.svg" alt="" width="8" height="4" style="transform:rotate(180deg)">
              </button>
              <button class="hp-save-btn tappable" id="hpSaveBtn" onclick="SaveFavorite.onSaveClick(this.dataset.hpName)" data-hp-name="">
                <img src="assets/icons/bookmark-outline.svg" alt="" width="10" height="10">
                <span>Save</span>
              </button>
            </div>
            <div class="hp-photos-outer">
              <div class="hp-photos-track" id="hpPhotosTrack" data-drag="horizontal"></div>
            </div>
            <div class="hp-info-section">
              <span class="hp-type-badge" id="hpInfoType">Hop-point</span>
              <p class="hp-info-desc" id="hpInfoDesc"></p>
              <p class="hp-info-dist" id="hpInfoDist"></p>
            </div>
          </div>

          <div class="hp-card-footer">
            <button id="hpCtaBtn" class="hp-cta-outline tappable" onclick="chooseHpAsDropoff()">Choose This Drop-off</button>
          </div>
        </div>

      </div>
    </div>

    <!-- ===== BOTTOM SHEET ===== -->
    <div class="cm-sheet">

      <!-- Pickup + Dropoff inputs -->
      <div class="cm-inputs">

        <!-- Left connector dots + arrow -->
        <div class="cm-connector">
          <div class="cm-dot cm-dot--pickup"></div>
          <div class="cm-arrow-wrap">
            <img src="assets/icons/arrow-up-fill.svg" alt="" width="24" height="26" style="transform:rotate(180deg)">
          </div>
          <div class="cm-dot cm-dot--dropoff"></div>
        </div>

        <!-- Input fields -->
        <div class="cm-fields">
          <div class="cm-field tappable" onclick="goToSearch('pickup')">
            <img src="assets/icons/location-pin-input.svg" alt="" width="16" height="16" class="cm-field-icon">
            <span class="cm-field-text" id="cmPickupText">Emquatiers main entrance</span>
            <button class="cm-field-clear hidden" id="cmPickupClear" onclick="event.stopPropagation(); clearField('pickup')">
              <img src="assets/icons/x-clear-1.svg" alt=""><img src="assets/icons/x-clear-2.svg" alt="">
            </button>
          </div>
          <div class="cm-field cm-field--placeholder tappable" onclick="goToSearch('destination')">
            <span class="cm-field-text" id="cmDropoffText">Drop-off</span>
            <button class="cm-field-clear hidden" id="cmDropoffClear" onclick="event.stopPropagation(); clearField('dropoff')">
              <img src="assets/icons/x-clear-1.svg" alt=""><img src="assets/icons/x-clear-2.svg" alt="">
            </button>
          </div>
        </div>

        <!-- Swap button -->
        <button class="cm-swap-btn tappable" onclick="swapFields()">
          <img src="assets/icons/swap.svg" alt="Swap" width="24" height="24">
        </button>

      </div>

      <!-- Next button -->
      <div class="cm-cta-wrap">
        <button class="cm-cta-btn" id="cmNextBtn" disabled onclick="goNext()">
          Next
        </button>
      </div>

      <!-- Home indicator -->
      <div class="home-indicator">
        <div class="home-indicator-bar"></div>
      </div>

    </div><!-- /cm-sheet -->

  </div><!-- /phone -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/area-config.js"></script>
  <script src="pages/choose-map/choose-map.js"></script>
  <script src="js/hoppoint-banner.js"></script>

  <!-- Proto Console -->
  <script>window.CONSOLE_PAGE = 'choose-map';</script>
  <script src="js/save-favorite.js"></script>
  <script src="proto-console.js"></script>

  <!-- Comment overlay -->
  <div id="c-overlay" class="hidden"
    style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:99998;cursor:crosshair;"
    onclick="handleCommentClick(event)"></div>

  <!-- Console FAB -->
  <button id="c-fab" onclick="toggleConsole()" style="z-index:99999;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
    </svg>
    <span class="c-label">Console</span>
  </button>

  <!-- Console Panel -->
  <div id="c-panel" class="hidden" style="background:#1A1A2E;z-index:99999;">
    <div style="padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:11px;font-weight:700;letter-spacing:0.6px;color:rgba(255,255,255,0.4);text-transform:uppercase;">Prototype Console</span>
      <button onclick="toggleConsole()" style="background:none;border:none;color:rgba(255,255,255,0.35);cursor:pointer;font-size:15px;line-height:1;padding:0;">&#x2715;</button>
    </div>
    <div style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.08);">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:8px;">State</div>
      <button onclick="consoleReset()"
        style="width:100%;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border:none;border-radius:10px;padding:9px 12px;color:#fff;cursor:pointer;font-family:inherit;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.49"/>
        </svg>
        <span style="font-size:13px;font-weight:600;">Reset</span>
      </button>
    </div>
    <div style="padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.08);">
      <div style="font-size:11px;font-weight:700;letter-spacing:0.5px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:8px;">Pages</div>
      <div style="display:flex;flex-direction:column;gap:4px;">
        <a href="index.html" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;">Home</a>
        <a href="search.html" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;">Search</a>
        <a href="choose-map.html" style="display:flex;align-items:center;gap:8px;background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.25);border-radius:10px;padding:8px 12px;color:#FCD34D;text-decoration:none;font-size:13px;font-weight:600;">
          Choose on Map <span style="margin-left:auto;font-size:10px;opacity:0.5;">current</span>
        </a>
        <a href="select-pickup.html" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;">Nearby Pickup</a>
        <a href="service-selection.html" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;">Service Selection</a>
        <a href="request.html" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;">Request</a>
        <a href="saved-places.html" style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.08);border-radius:10px;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px;font-weight:600;">Saved Places</a>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator)
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  </script>
</body>
</html>
