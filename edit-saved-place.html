<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muvmi — Edit Saved Place</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="pages/edit-saved-place/edit-saved-place.css">
</head>
<body>

  <div class="phone">

    <!-- ===== MAP SECTION ===== -->
    <div class="edit-map">
      <div id="editMapLeaflet"></div>

      <!-- Status bar -->
      <div class="status-bar">
        <span class="status-bar-time">9:41</span>
        <div class="status-bar-icons">
          <img src="assets/icons/signal.svg" alt="" width="16" height="16">
          <img src="assets/icons/wifi.svg" alt="" width="16" height="16">
          <img src="assets/icons/battery.svg" alt="" width="18" height="18">
        </div>
      </div>

      <!-- Header: back + place name pill -->
      <div class="edit-map-header">
        <button class="edit-map-back-btn tappable" onclick="history.back()">
          <img src="assets/icons/back-btn.svg" alt="Back" width="32" height="32">
        </button>
        <div class="edit-map-pill" id="editPillName" data-id="editPillName"></div>
      </div>

      <!-- GPS recenter -->
      <button class="edit-gps-btn tappable" onclick="recenterMap()">
        <img src="assets/icons/gps-location.svg" alt="" width="18" height="18">
      </button>
    </div>

    <!-- ===== EDIT FORM SHEET ===== -->
    <div class="edit-sheet">

      <!-- Title -->
      <p class="edit-sheet-title">Save your favorite place</p>

      <!-- Form body -->
      <div class="edit-sheet-body">

        <!-- Hop-point card -->
        <div class="edit-hp-card">
          <div class="edit-hp-card-icon">
            <img src="assets/icons/hop-point-list.svg" alt="" width="14" height="19">
          </div>
          <span class="edit-hp-card-name" id="editHpName" data-id="editHpName"></span>
        </div>

        <!-- Fields -->
        <div class="edit-fields">
          <div class="edit-field">
            <span class="edit-field-label">Address name</span>
            <input type="text" class="edit-field-input" id="editNameInput"
                   placeholder="Name" autocomplete="off" autocorrect="off" spellcheck="false">
          </div>
          <div class="edit-field">
            <span class="edit-field-label">Label</span>
            <div class="edit-labels-row" id="editLabelsRow"></div>
          </div>
        </div>

      </div>

      <!-- Footer: Delete + Save -->
      <div class="edit-sheet-footer">
        <div class="edit-footer-btns">
          <button class="edit-delete-btn tappable" id="editDeleteBtn" onclick="deletePlace()">Delete</button>
          <button class="edit-save-btn tappable" onclick="saveEdit()">Save</button>
        </div>
        <div class="home-indicator">
          <div class="home-indicator-bar"></div>
        </div>
      </div>

    </div>

  </div><!-- /phone -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/save-favorite.js"></script>
  <script src="pages/edit-saved-place/edit-saved-place.js"></script>

  <script>
    if ('serviceWorker' in navigator)
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  </script>

  <script src="js/remote.js"></script>
</body>
</html>
